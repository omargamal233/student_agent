[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-agent"
version = "0.1.0"
description = "Student Intelligence agent: dropout-risk assessment and advice (LangChain + Groq)"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
student-agent = "student_agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
